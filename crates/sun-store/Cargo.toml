[package]
name = "sun-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
chacha20poly1305 = "0.11.0"
chrono.workspace = true
# Same version as sqlx-sqlite (bundled SQLite); only for `sqlite3_auto_extension`.
libsqlite3-sys = { version = "0.30.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
# Vector distance for `chunk_vec`, statically linked into the bundled SQLite.
sqlite-vec = "0.1.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
sun-core.workspace = true
thiserror.workspace = true
tokio = { version = "1.48.0", features = ["sync", "rt"] }
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

# The workspace lints, except `unsafe_code` is `deny` (not `forbid`) so the one
# FFI call that registers sqlite-vec can opt out (`register_sqlite_vec`).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
