[package]
name = "sun-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sun-core.workspace = true
sun-runtime.workspace = true
async-trait.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# Only enables rustls' `ring` provider so `wss://` works (tokio-tungstenite
# pulls rustls without one).
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
# Editor write preconditions (already in the tree via sun-api).
sha2 = "0.10.9"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
# Terminals (`pty.open`): openpty + setsid, which need `unsafe` this workspace forbids.
pty-process = { version = "=0.5.3", features = ["async"] }

# `PR_SET_DUMPABLE` (`forbid_inspection`) without `unsafe`.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process"] }

[dev-dependencies]
futures-core.workspace = true
# The echo test mod serves an `extension` exec env.
sun-mod.workspace = true
tempfile = "3.23.0"
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
