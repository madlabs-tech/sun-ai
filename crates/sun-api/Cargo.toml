[package]
name = "sun-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.6.0"
async-trait.workspace = true
base64 = "0.22.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio", "ws"] }
chrono.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hmac = "0.12.1"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
openidconnect = "4.0.1"
# Pure-Rust WebAuthn relying party: webauthn-rs needs OpenSSL, which the musl release builds lack.
passkey-auth = "0.1.3"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10.6"
sha2 = "0.10.9"
sun-catalog.workspace = true
sun-context.workspace = true
sun-core.workspace = true
sun-engine.workspace = true
tokio = { version = "1.48.0", features = ["io-util", "macros", "rt", "sync", "time"] }
tracing = "0.1.44"
ulid.workspace = true

[dev-dependencies]
http-body-util = "0.1.3"
# The tests' software passkey signs with it.
p256 = { version = "0.13.2", features = ["ecdsa"] }
sun-host.workspace = true
sun-runtime.workspace = true
sun-store.workspace = true
# Loopback GitHub and GitLab mocks for the git connection tests.
sun-mod-sdk = { workspace = true, features = ["http"] }
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.2", features = ["util"] }

[lints]
workspace = true
