[package]
name = "sun-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository = "https://github.com/madlabs-tech/sun-ai"

[lib]
name = "sun_cli"
path = "src/lib.rs"

[[bin]]
name = "sun"
path = "src/main.rs"

# Test fixture for the end-to-end test: a `github`-shaped mod that answers
# every action (the default workflow's `github.open_pr`) without a network.
[[bin]]
name = "sun-e2e-mod"
path = "tests/fixtures/e2e_mod.rs"
test = false

[dependencies]
anyhow = "1.0.104"
async-trait.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
# SMTP for invites: rustls only, ring and webpki roots as elsewhere here.
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
semver.workspace = true
sun-api.workspace = true
sun-catalog.workspace = true
base64 = "0.22.1"
sun-context.workspace = true
sun-core.workspace = true
sun-engine.workspace = true
sun-host.workspace = true
sun-mod.workspace = true
ed25519-dalek.workspace = true
sun-mod-sdk = { workspace = true, features = ["http"] }
sun-runtime.workspace = true
sun-store.workspace = true
sun-workflow.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "registry", "std"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
chrono.workspace = true
tempfile = "3.23.0"

[lints]
workspace = true

[package.metadata.dist]
dist = true
binaries = { "*" = ["sun"] }
# The service files scripts/install.sh writes.
include = ["../../packaging/systemd/sun.service", "../../packaging/launchd/dev.sun.kernel.plist"]
