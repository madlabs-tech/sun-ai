[package]
name = "sun-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
# Inlines blobs into outbox deliveries (same version as sun-api).
base64 = "0.22.1"
chrono.workspace = true
# The eval sandbox's merged host event stream (`eval`).
futures-core.workspace = true
# Decodes preview screenshots to crop pins and compare screens.
png = "0.18.1"
# Task keys in PR titles, branches and closing keywords (`pull_requests`).
regex.workspace = true
# Signs the GitHub App JWT (RS256). Already in the tree through rustls;
# maintained by the rustls project.
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
serde.workspace = true
# A repo's `.sun/exec_env.yaml` (same parser as sun-workflow).
serde-saphyr.workspace = true
serde_json.workspace = true
sun-context.workspace = true
sun-core.workspace = true
sun-store.workspace = true
sun-workflow.workspace = true
tokio = { version = "1.48.0", features = ["macros", "rt", "sync", "time"] }
# `/v1/systemone` calls, on the blocking pool (same ureq as sun-context).
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
sun-runtime.workspace = true
# Loopback HTTP mock for the export webhook test.
sun-mod-sdk = { workspace = true, features = ["http"] }
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
