[package]
name = "sun-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository = "https://github.com/madlabs-tech/sun-ai"

[dependencies]
sun-core.workspace = true
sun-mod-sdk.workspace = true
async-trait.workspace = true
ed25519-dalek.workspace = true
sha2 = "=0.10.9"
futures-core.workspace = true
# MCP connectors: same rmcp as sun-context. The HTTP client uses
# rustls with ring (the provider ureq already pulls in), not aws-lc.
rmcp = { version = "3.5.1", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
semver.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing = "0.1.44"

# The Linux sandbox launcher.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"
libc = "0.2.190"
nix = { version = "=0.31.3", default-features = false, features = ["sched", "socket", "user"] }
seccompiler = "=0.5.0"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "registry", "std"] }

# The echo test mod, spawned by tests/mod_host.rs.
[[bin]]
name = "sun-echo-mod"
path = "tests/fixtures/echo_mod.rs"
test = false
doc = false

# The tiny MCP server, spawned by tests/mcp.rs.
[[bin]]
name = "sun-echo-mcp"
path = "tests/fixtures/echo_mcp.rs"
test = false
doc = false

# Jails itself, then runs a sandboxed mod (Linux).
[[bin]]
name = "sun-mod-sandbox"
path = "src/sandbox/launcher_main.rs"
test = false
doc = false

# The malicious test mod, spawned by tests/sandbox.rs.
[[bin]]
name = "sun-evil-mod"
path = "tests/fixtures/evil_mod.rs"
test = false
doc = false

[lints]
workspace = true

# Ship only the sandbox launcher, next to `sun`.
[package.metadata.dist]
dist = true
binaries = { "*" = ["sun-mod-sandbox"] }
