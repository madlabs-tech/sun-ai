[workspace]
resolver = "3"
members = [
    "crates/sun-core",
    "crates/sun-store",
    "crates/sun-workflow",
    "crates/sun-engine",
    "crates/sun-context",
    "crates/sun-runtime",
    "crates/sun-host",
    "crates/sun-mod",
    "crates/sun-api",
    "crates/sun-cli",
    "crates/sun-catalog",
    "sdk/rust",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
sun-core = { path = "crates/sun-core" }
sun-store = { path = "crates/sun-store" }
sun-workflow = { path = "crates/sun-workflow" }
sun-engine = { path = "crates/sun-engine" }
sun-context = { path = "crates/sun-context" }
sun-runtime = { path = "crates/sun-runtime" }
sun-host = { path = "crates/sun-host" }
sun-mod = { path = "crates/sun-mod" }
sun-api = { path = "crates/sun-api" }
sun-catalog = { path = "crates/sun-catalog" }
sun-mod-sdk = { path = "sdk/rust" }

async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
ed25519-dalek = "3.0.0"
futures-core = "0.3.34"
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = "1.53.2"
ulid = { version = "3.0.0", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Release binary (<= 40 MB with the UI). cargo-dist builds `dist`.
# `sun` with the UI must stay <= 40 MB (scripts/footprint.sh).
# `panic = "abort"`: nothing catches panics (no catch_unwind, no JoinError::is_panic);
# a panic ends the process like kill -9 and the step journal resumes (tests/crash.rs).
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dist]
inherits = "release"

# Debug info dominates target/ size (several worktrees build in parallel).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
