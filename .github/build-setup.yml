# Injected by cargo-dist (dist-workspace.toml `github-build-setup`) into
# every release build job, before `cargo build --release`: sun-api embeds
# web/dist at compile time, so without this the release binary answers 404 on /.
# (dist drops `working-directory`, hence the `cd`.)
- name: Install Node
  uses: actions/setup-node@v4
  with:
    node-version: 24
- name: Build the web UI
  run: cd web && npm ci && npm run build
# sqlite-vec.c needs the BSD u_intN_t names; musl only has them in sys/types.h,
# which it never includes (glibc's stdlib.h pulls it in). macOS ignores this.
- name: C flags for the musl targets
  run: echo "TARGET_CFLAGS=-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t" >> "$GITHUB_ENV"
