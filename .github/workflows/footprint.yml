# Footprint gate: builds the release binary with the UI, measures
# binary size and idle RSS of `sun serve --with-host`, fails over budget and
# publishes the numbers (job summary + footprint.json artifact).
# Called by release.yml (cargo-dist `global-artifacts-jobs`), on PRs to main
# (so a tag never finds an over-budget binary first) and by hand.
name: Footprint

on:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  footprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Footprint
        env:
          FOOTPRINT_JSON: footprint.json
        run: bash scripts/footprint.sh
      - if: always()
        run: '[ -f footprint.json ] && cat footprint.json >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts-footprint
          path: footprint.json
          if-no-files-found: ignore
