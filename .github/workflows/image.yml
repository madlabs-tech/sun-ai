# Builds the kernel image and publishes it to GHCR. The VPS pulls it: a timer
# on the box (hryer/vps-infra, poll-deploy.sh) sees the new `:main`, reads its
# revision label, and runs deploy.sh (health gate + rollback). CI never
# connects to the box.
#
# The binaries are cross-built for x86_64-unknown-linux-musl on the runner
# (Swatinem/rust-cache keeps the deps warm) and copied into dist/, the build
# context; the Dockerfile only packages them.
# Pull requests: build only, nothing pushed.
name: image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/madlabs-tech/sun-kernel
  TARGET: x86_64-unknown-linux-musl

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install && rustup target add "$TARGET"
      # musl-gcc: the bundled sqlite, ring and zstd compile C for the musl target.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}
      # registry-url makes setup-node write the token from NODE_AUTH_TOKEN to
      # ~/.npmrc; npm itself ignores that env var.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@hryer'
      # sun-api embeds web/dist at compile time (see .github/build-setup.yml).
      - name: Build the web UI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: cd web && npm ci && npm run build
      - name: Build the kernel
        env:
          # sqlite-vec.c needs the BSD u_intN_t names; musl only has them in
          # sys/types.h, which it never includes (glibc's stdlib.h pulls it in).
          TARGET_CFLAGS: -Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t
        run: cargo build --release --locked --target "$TARGET" -p sun-cli -p sun-mod --bin sun --bin sun-mod-sandbox
      # The build context is only the two binaries.
      - run: mkdir -p dist && cp "target/$TARGET/release/sun" "target/$TARGET/release/sun-mod-sandbox" dist/
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: dist
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          # poll-deploy.sh resolves `:main` to a commit through this label.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
