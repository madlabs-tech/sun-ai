# DEBUG BRANCH (BLO-112): is the Cloudflare managed challenge zone-wide?
# Probe every proxied madlabs.tech host from a hosted runner. Not for merge.
name: Install URL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "runner egress IP: $(curl -sS https://api.ipify.org)"
          for u in https://get-sun.madlabs.tech/ https://sun.madlabs.tech/ https://madlabs.tech/ https://www.madlabs.tech/ https://medika.madlabs.tech/health https://jobs.madlabs.tech/; do
            out=$(curl -sS -o /dev/null -D - --max-time 30 "$u" 2>&1)
            code=$(printf '%s' "$out" | head -1 | tr -d '\r')
            mit=$(printf '%s' "$out" | grep -i '^cf-mitigated:' | tr -d '\r')
            printf '%-40s %s %s\n' "$u" "$code" "${mit:-cf-mitigated: (none)}"
          done
