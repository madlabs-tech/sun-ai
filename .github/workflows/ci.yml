name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    # pinned: sun-mod sandbox fails on 26.04, see BLO-194
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # The mod sandbox (sun-mod-sandbox) needs unprivileged user namespaces,
      # which Ubuntu's AppArmor restricts by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: bash scripts/check-deps.sh

  # The mod sandbox on Ubuntu 26.04, whose coreutils are one multicall
  # binary under /usr/lib (BLO-194). Stays when `rust` moves to 26.04.
  sandbox-ubuntu-26:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo test --locked -p sun-mod --test it sandbox

  web:
    # pinned: sun-mod sandbox fails on 26.04, see BLO-194
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
