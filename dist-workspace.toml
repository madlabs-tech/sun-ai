# cargo-dist: `dist generate` writes .github/workflows/release.yml
# from this file; `dist plan` shows the artifacts. A release is a pushed
# `v*` tag. Two archives per target: `sun-cli` (the `sun` binary, web UI
# embedded) and `sun-mod` (only `sun-mod-sandbox`); scripts/install.sh puts
# both in one directory, because the kernel looks for the launcher next to
# its own executable.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
# scripts/install.sh is the installer (systemd/launchd unit, sign-in link).
installers = []
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# Build web/dist before cargo, in every build job.
github-build-setup = "../build-setup.yml"
# `npm ci` in the footprint job reads @hryer/madlabs-design-system from GitHub Packages.
github-custom-job-permissions = { "footprint" = { packages = "read", contents = "read" }, "sign-release" = { contents = "write" } }
# Gate: fail the release when the binary or idle RSS breaks the footprint budget (40 MB binary, 40 MB idle RSS).
global-artifacts-jobs = ["./footprint"]
# Sign sha256.sum after the release exists (install.sh verifies it).
publish-jobs = ["./sign-release"]
# Prereleases get signed too.
publish-prereleases = true
