[package]
name = "hello-kernel"
version = "0.0.0"
edition = "2024"
publish = false
description = "Footprint probe for Sun's kernel stack (tokio + axum + sqlx/SQLite). Not shipped."

# Standalone: never part of the root workspace.
[workspace]

[dependencies]
axum = { version = "0.8.4", default-features = false, features = ["http1", "tokio"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net"] }

# Same knobs the real release build is expected to use.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
