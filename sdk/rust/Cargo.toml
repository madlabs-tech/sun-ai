[package]
name = "sun-mod-sdk"
description = "SDK for Sun mods: mod.yaml manifest types and the JSON-RPC 2.0 stdio loop"
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Apache-2.0 and standalone: depends on nothing from crates/.
[dependencies]
serde.workspace = true
serde_json.workspace = true
# Feature `http`: helpers for mods that call a third-party JSON API.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"], optional = true }

[features]
http = ["dep:ureq"]

[lints]
workspace = true
